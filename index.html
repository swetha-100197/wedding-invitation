<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Wedding Invite</title>
    <!-- FONTS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <script defer src="js/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <section class="envelope-section" id="envelopeSection">
      <img src="assets/wrapper.jpeg" class="envelope-bg" />
      <img
        src="assets/heart.png"
        class="heart-btn"
        onclick="openInvitation()"
      />
      <div class="invite-text">
        <div class="you-are">You are</div>
        <div class="invited">INVITED</div>
      </div>
    </section>
    <div class="video-section" id="videoSection">
      <video id="introVideo"  playsinline muted preload="auto">
        <source src="video/opening-video.mp4" type="video/mp4" />
      </video>
    </div>
    <main class="main-content" id="mainContent">
      <section class="story-section" id="storySection">
        <img src="assets/layer-9.png" class="gold-bottom-left" />
        <img src="assets/layer-9-copy-2.png" class="silver-left" />
        <img src="assets/layer-9-copy-3.png" class="silver-right" />
        <div class="jr-wrapper">
          <img src="assets/richard.png" class="logo-r" />
          <img src="assets/jeevitha.png" class="logo-j" />
        </div>
        <div class="story-text">
          <span class="gold-letter">R</span>eal Story,<br />
          No <span class="gold-letter">R</span>etakes
        </div>
      </section>
      <section class="couple-section" id="coupleSection">
        <img src="assets/layer-9.png" class="gold-bottom-left" />
        <img src="assets/layer-9-copy-2.png" class="silver-left" />
        <img src="assets/layer-9-copy-3.png" class="silver-right" />
        <div class="couple-content">
          <h1 class="groom-name" data-text="Richard Samson"></h1>
          <div class="weds-text">weds</div>
          <h1 class="bride-name" data-text="Jeevitha Baskar"></h1>
        </div>
      </section>
      <section class="date-section" id="dateSection">
        <img src="assets/layer-9.png" class="gold-bottom-left" />
        <img src="assets/layer-9-copy-2.png" class="silver-left" />
        <img src="assets/layer-9-copy-3.png" class="silver-right" />
        <div class="date-content">
          <div class="save-date-text">Save the Date</div>
          <div class="main-date">17.06.2026</div>
          <div class="event-time">Wednesday,7pm Onwards</div>
        </div>
      </section>
      <section class="countdown-section" id="countdownSection">
        <img src="assets/layer-9.png" class="gold-bottom-left" />

        <img src="assets/layer-9-copy-2.png" class="silver-left" />
        <img src="assets/layer-9-copy-3.png" class="silver-right" />
        <div class="countdown-content">
          <div class="countdown-title">UNTIL THE BIG DAY</div>
          <div class="countdown-timer">
            <div class="time-box">
              <span id="days">00</span>
              <p>DAYS</p>
            </div>
            <div class="colon">:</div>
            <div class="time-box">
              <span id="hours">00</span>
              <p>HOURS</p>
            </div>
            <div class="colon">:</div>
            <div class="time-box">
              <span id="minutes">00</span>
              <p>MINS</p>
            </div>
            <div class="colon">:</div>
            <div class="time-box">
              <span id="seconds">00</span>
              <p>SEC</p>
            </div>
          </div>
        </div>
      </section>
      <section class="venue-section" id="venueSection">
        <img src="assets/layer-9.png" class="gold-bottom-left" />
        <img src="assets/layer-9-copy-2.png" class="silver-left" />
        <img src="assets/layer-9-copy-3.png" class="silver-right" />
        <div class="venue-content">
          <div class="venue-title">
            <span class="location-icon">📍</span>
            VENUE
          </div>
          <div class="venue-name">AJ GARDENS, REDHILLS</div>
          <img src="assets/q5.png" class="venue-qr" />
          <div class="scan-text">Scan for Location</div>
        </div>
      </section>
    </main>
  </body>
</html>
